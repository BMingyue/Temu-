<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 小狮子获取器</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img class="logo-icon" src="icon.png" alt="小狮子图标">
        <span class="logo-text">小狮子获取器</span>
      </div>
    </div>

    <div class="register-panel">
      <h2 class="panel-title">账号注册</h2>

      <form id="registerForm">
        <div class="form-item">
          <label for="account">账号</label>
          <input type="text" id="account" placeholder="请输入账号" required>
        </div>

        <div class="form-item">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>

        <div class="form-item">
          <label for="name">名称（可选）</label>
          <input type="text" id="name" placeholder="请输入名称">
        </div>

        <div class="info-message">
          注册成功后需要管理员开通才能使用
        </div>

        <div class="error-message" id="errorMessage"></div>

        <button type="submit" class="btn btn-register">
          <span>注册</span>
        </button>
      </form>

      <div class="login-link">
        <span>已有账号？</span>
        <a href="#" id="loginLink">立即登录</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="register.js"></script>
</body>
</html>
